<svg xmlns="http://www.w3.org/2000/svg" width="460" height="350" viewBox="0 0 460 350" role="img" aria-label="Três qubits físicos em linha: SWAP(0,1) leva o qubit lógico a para o físico 1, CNOT(1,2) age sobre c, e outro SWAP devolve a ao físico 0">
