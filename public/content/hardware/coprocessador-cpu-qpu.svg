<svg xmlns="http://www.w3.org/2000/svg" width="620" height="260" viewBox="0 0 620 260" role="img" aria-label="A CPU clássica envia instruções de portas e medidas à QPU e recebe de volta apenas bits medidos, nunca as amplitudes">
<style>.b{fill:#1f2937;stroke:#a78bfa;stroke-width:2.5}.l{stroke:#9ca3af;stroke-width:2;fill:none}.p{stroke:#a78bfa;stroke-width:3;fill:none}.t{fill:#f3f4f6;font:600 18px sans-serif;text-anchor:middle}.s{fill:#d1d5db;font:15px sans-serif;text-anchor:middle}.v{fill:#a78bfa;font:600 16px sans-serif;text-anchor:middle}.f{fill:#a78bfa}.g{fill:#34d399}.d{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.o{stroke:#fb923c;stroke-width:2.5;fill:#1f2937}.k{stroke:#38bdf8;stroke-width:2.5;fill:#1f2937}.r{fill:#f87171;font:600 16px sans-serif;text-anchor:middle}.gt{fill:#34d399;font:600 16px sans-serif;text-anchor:middle}.e{text-anchor:start}.n{text-anchor:end}</style><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0L12,6L0,12z" fill="#a78bfa"/></marker><marker id="ag" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0L12,6L0,12z" fill="#9ca3af"/></marker></defs>
<rect x="20" y="40" width="200" height="150" rx="12" class="b"/><text x="120" y="75" class="t" >CPU clássica</text><text x="120" y="98" class="s" >(hospedeira)</text><text x="120" y="140" class="s" >código do</text><text x="120" y="160" class="s" >programa</text><rect x="400" y="40" width="200" height="150" rx="12" class="b"/><text x="500" y="75" class="t" >QPU</text><circle cx="435" cy="130" r="16" class="b"/><text x="435" y="135" class="s" >q</text><circle cx="478" cy="130" r="16" class="b"/><text x="478" y="135" class="s" >q</text><circle cx="521" cy="130" r="16" class="b"/><text x="521" y="135" class="s" >q</text><circle cx="564" cy="130" r="16" class="b"/><text x="564" y="135" class="s" >q</text><text x="500" y="172" class="s" >fileira de qubits</text><line x1="224" y1="100" x2="394" y2="100" class="p" marker-end="url(#a)"/><text x="310" y="62" class="v" >instruções:</text><text x="310" y="80" class="v" >portas e medidas</text><line x1="396" y1="150" x2="226" y2="150" stroke="#34d399" stroke-width="3" fill="none" marker-end="url(#ag)"/><text x="310" y="178" class="gt" >bits medidos</text><text x="310" y="235" class="r" >as amplitudes α, β não atravessam a seta de volta</text>
</svg>
