<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="Fusão tipo I: duas cadeias de 2 nós passam por um divisor com detectores; com sucesso viram uma cadeia de 3 nós, com falha perde-se um pedaço">
