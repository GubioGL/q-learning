<svg xmlns="http://www.w3.org/2000/svg" width="600" height="245" viewBox="0 0 600 245" role="img" aria-label="Um fóton em dois caminhos A e B, com polarização horizontal H ou vertical V, dá quatro estados de base de dois qubits">
<style>.b{fill:#1f2937;stroke:#a78bfa;stroke-width:2.5}.l{stroke:#9ca3af;stroke-width:2;fill:none}.p{stroke:#a78bfa;stroke-width:3;fill:none}.t{fill:#f3f4f6;font:600 18px sans-serif;text-anchor:middle}.s{fill:#d1d5db;font:15px sans-serif;text-anchor:middle}.v{fill:#a78bfa;font:600 16px sans-serif;text-anchor:middle}.f{fill:#a78bfa}.g{fill:#34d399}.d{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.o{stroke:#fb923c;stroke-width:2.5;fill:#1f2937}.k{stroke:#38bdf8;stroke-width:2.5;fill:#1f2937}.r{fill:#f87171;font:600 16px sans-serif;text-anchor:middle}.gt{fill:#34d399;font:600 16px sans-serif;text-anchor:middle}.e{text-anchor:start}.n{text-anchor:end}</style><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0L12,6L0,12z" fill="#a78bfa"/></marker><marker id="ag" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0L12,6L0,12z" fill="#9ca3af"/></marker></defs>
<text x="160" y="28" class="v" >caminhos</text><line x1="30" y1="70" x2="300" y2="70" class="l"/><text x="18" y="76" class="t" >A</text><line x1="30" y1="150" x2="300" y2="150" class="l"/><text x="18" y="156" class="t" >B</text><circle cx="160" cy="70" r="20" class="b"/><text x="160" y="80" class="t" style="font-size:24px" >↔</text><text x="160" y="112" class="s" >fóton: |H<tspan baseline-shift="sub" font-size="75%">A</tspan>⟩</text><text x="165" y="200" class="s" >↔ = polarização H     ↕ = polarização V</text><text x="160" y="225" class="s" >(um fóton: 2 caminhos × 2 polarizações)</text><rect x="340" y="40" width="240" height="170" rx="10" class="b"/><text x="400" y="85" class="t" >|H<tspan baseline-shift="sub" font-size="75%">A</tspan>⟩</text><text x="460" y="85" class="s" >=</text><text x="520" y="85" class="v" >|00⟩</text><text x="400" y="123" class="t" >|V<tspan baseline-shift="sub" font-size="75%">A</tspan>⟩</text><text x="460" y="123" class="s" >=</text><text x="520" y="123" class="v" >|10⟩</text><text x="400" y="161" class="t" >|H<tspan baseline-shift="sub" font-size="75%">B</tspan>⟩</text><text x="460" y="161" class="s" >=</text><text x="520" y="161" class="v" >|01⟩</text><text x="400" y="199" class="t" >|V<tspan baseline-shift="sub" font-size="75%">B</tspan>⟩</text><text x="460" y="199" class="s" >=</text><text x="520" y="199" class="v" >|11⟩</text><text x="460" y="28" class="v" >4 estados de base</text>
