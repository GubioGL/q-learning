<svg xmlns="http://www.w3.org/2000/svg" width="600" height="275" viewBox="0 0 600 275" role="img" aria-label="Um fóton H passa por uma placa de onda tipo Hadamard e por um PBS, que separa os termos H A e V B e gera um estado de Bell">
<style>.b{fill:#1f2937;stroke:#a78bfa;stroke-width:2.5}.l{stroke:#9ca3af;stroke-width:2;fill:none}.p{stroke:#a78bfa;stroke-width:3;fill:none}.t{fill:#f3f4f6;font:600 18px sans-serif;text-anchor:middle}.s{fill:#d1d5db;font:15px sans-serif;text-anchor:middle}.v{fill:#a78bfa;font:600 16px sans-serif;text-anchor:middle}.f{fill:#a78bfa}.g{fill:#34d399}.d{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.o{stroke:#fb923c;stroke-width:2.5;fill:#1f2937}.k{stroke:#38bdf8;stroke-width:2.5;fill:#1f2937}.r{fill:#f87171;font:600 16px sans-serif;text-anchor:middle}.gt{fill:#34d399;font:600 16px sans-serif;text-anchor:middle}.e{text-anchor:start}.n{text-anchor:end}</style><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0L12,6L0,12z" fill="#a78bfa"/></marker><marker id="ag" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0L12,6L0,12z" fill="#9ca3af"/></marker></defs>
<rect x="20" y="70" width="80" height="60" rx="10" class="b"/><text x="60" y="95" class="t" >fonte</text><text x="60" y="118" class="s" >|H<tspan baseline-shift="sub" font-size="75%">A</tspan>⟩</text><line x1="100" y1="100" x2="170" y2="100" class="l"/><rect x="170" y="78" width="60" height="44" rx="8" class="b"/><text x="200" y="106" class="t" >H</text><text x="200" y="66" class="s" >placa de onda</text><line x1="230" y1="100" x2="300" y2="100" class="l"/><text x="250" y="150" class="s" >1/√2 (|H⟩+|V⟩)</text><rect x="300" y="75" width="50" height="50" class="b"/><line x1="300" y1="125" x2="350" y2="75" class="p"/><text x="325" y="60" class="v" >PBS</text><line x1="350" y1="100" x2="570" y2="100" class="l"/><text x="560" y="90" class="t" >A</text><text x="450" y="90" class="s" >|H⟩</text><line x1="325" y1="125" x2="325" y2="190" class="l"/><line x1="325" y1="190" x2="570" y2="190" class="l"/><text x="560" y="180" class="t" >B</text><text x="450" y="180" class="s" >|V⟩</text><text x="300" y="250" class="v" >1/√2 (|H<tspan baseline-shift="sub" font-size="75%">A</tspan>⟩ + |V<tspan baseline-shift="sub" font-size="75%">B</tspan>⟩) = 1/√2 (|00⟩ + |11⟩)</text>
</svg>
