<svg xmlns="http://www.w3.org/2000/svg" width="460" height="170" viewBox="0 0 460 170" role="img" aria-label="A = [[3, 1−i],[1+i, 1]] decomposta como 2I + X + Y + Z, com a origem de cada coeficiente"><style>.b{fill:#1f2937;stroke:#a78bfa;stroke-width:2.5}.x{fill:#374151;stroke:#6b7280;stroke-width:2;stroke-dasharray:4 3}.l{stroke:#9ca3af;stroke-width:2;fill:none}.p{stroke:#a78bfa;stroke-width:3;fill:none}.t{fill:#f3f4f6;font:600 18px sans-serif;text-anchor:middle}.s{fill:#d1d5db;font:15px sans-serif;text-anchor:middle}.v{fill:#a78bfa;font:600 16px sans-serif;text-anchor:middle}.f{fill:#a78bfa}.g{stroke:#34d399;stroke-width:3;fill:none}.gf{fill:#34d399;font:600 16px sans-serif}.d{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.r{stroke:#f87171;stroke-width:3}</style>
<text class="t" x="20" y="35" style="text-anchor:start">A = [ 3, 1−i ; 1+i, 1 ]</text>
<text class="t" x="20" y="85" style="text-anchor:start">A = 2·I + 1·X + 1·Y + 1·Z</text>
<text class="s" x="20" y="125" style="text-anchor:start">diagonal: a₀ + a₃ = 3 e a₀ − a₃ = 1, então a₀ = 2 e a₃ = 1</text>
<text class="s" x="20" y="150" style="text-anchor:start">canto superior direito: a₁ − i·a₂ = 1 − i, então a₁ = 1 e a₂ = 1</text>
</svg>
