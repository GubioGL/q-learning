<svg xmlns="http://www.w3.org/2000/svg" width="320" height="400" viewBox="0 0 320 400" role="img" aria-label="Plano complexo: o ponto z = 3+4i a distância 5 da origem e seu conjugado 3−4i, refletido no eixo real"><style>.b{fill:#1f2937;stroke:#a78bfa;stroke-width:2.5}.x{fill:#374151;stroke:#6b7280;stroke-width:2;stroke-dasharray:4 3}.l{stroke:#9ca3af;stroke-width:2;fill:none}.p{stroke:#a78bfa;stroke-width:3;fill:none}.t{fill:#f3f4f6;font:600 18px sans-serif;text-anchor:middle}.s{fill:#d1d5db;font:15px sans-serif;text-anchor:middle}.v{fill:#a78bfa;font:600 16px sans-serif;text-anchor:middle}.f{fill:#a78bfa}.g{stroke:#34d399;stroke-width:3;fill:none}.gf{fill:#34d399;font:600 16px sans-serif}.d{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.r{stroke:#f87171;stroke-width:3}</style>
<line class="l" x1="30" y1="200" x2="260" y2="200"/><line class="l" x1="80" y1="20" x2="80" y2="380"/>
