<circle class="f" cx="270.0" cy="148.0" r="4"/>
<text class="k" x="270.0" y="175.0">3</text>
<text class="t" x="270" y="194">j = 1</text>
<text class="s" x="270" y="214">giro de 90° por passo</text>
<circle class="d" cx="90" cy="310" r="48"/><line class="l" x1="34" y1="310" x2="146" y2="310" style="stroke-width:1"/><line class="l" x1="90" y1="254" x2="90" y2="366" style="stroke-width:1"/>
<line class="p" x1="90" y1="310" x2="138.0" y2="310.0" marker-end="url(#ap)" style="stroke-width:2.5"/>
