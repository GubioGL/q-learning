<text class="k" x="168.0" y="105.0">0–3</text>
<text class="t" x="90" y="194">j = 0</text>
<text class="s" x="90" y="214">giro de 0° por passo</text>
<circle class="d" cx="270" cy="100" r="48"/><line class="l" x1="214" y1="100" x2="326" y2="100" style="stroke-width:1"/><line class="l" x1="270" y1="44" x2="270" y2="156" style="stroke-width:1"/>
<line class="p" x1="270" y1="100" x2="318.0" y2="100.0" marker-end="url(#ap)" style="stroke-width:2.5"/>
<circle class="f" cx="318.0" cy="100.0" r="4"/>
<text class="k" x="340.0" y="105.0">0</text>
<line class="p" x1="270" y1="100" x2="270.0" y2="52.0" marker-end="url(#ap)" style="stroke-width:2.5"/>
