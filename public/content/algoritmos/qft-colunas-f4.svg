<circle class="d" cx="270" cy="310" r="48"/><line class="l" x1="214" y1="310" x2="326" y2="310" style="stroke-width:1"/><line class="l" x1="270" y1="254" x2="270" y2="366" style="stroke-width:1"/>
<line class="p" x1="270" y1="310" x2="318.0" y2="310.0" marker-end="url(#ap)" style="stroke-width:2.5"/>
<circle class="f" cx="318.0" cy="310.0" r="4"/>
<text class="k" x="340.0" y="315.0">0</text>
<line class="p" x1="270" y1="310" x2="270.0" y2="358.0" marker-end="url(#ap)" style="stroke-width:2.5"/>
<circle class="f" cx="270.0" cy="358.0" r="4"/>
<text class="k" x="270.0" y="385.0">1</text>
<line class="p" x1="270" y1="310" x2="222.0" y2="310.0" marker-end="url(#ap)" style="stroke-width:2.5"/>
<circle class="f" cx="222.0" cy="310.0" r="4"/>
<text class="k" x="200.0" y="315.0">2</text>
<line class="p" x1="270" y1="310" x2="270.0" y2="262.0" marker-end="url(#ap)" style="stroke-width:2.5"/>
<circle class="f" cx="270.0" cy="262.0" r="4"/>
<text class="k" x="270.0" y="245.0">3</text>
<text class="t" x="270" y="404">j = 3</text>
<text class="s" x="270" y="424">giro de 270° por passo</text>
<text class="s" x="180" y="14">pontos ω<tspan baseline-shift='super' font-size='75%'>jk</tspan>, para k = 0, 1, 2, 3</text>
</svg>
