<text class="ts" x="20" y="235">1  carregar |b⟩ = Σ βⱼ |uⱼ⟩</text>
<text class="ts" x="20" y="261">2  PE de e<tspan baseline-shift='super' font-size='75%'>iAτ</tspan>: Σ βⱼ |uⱼ⟩ |λⱼ⟩</text>
<text class="ts" x="20" y="287">3  rotação: ancila → √(1−C²/λⱼ²)|0⟩ + (C/λⱼ)|1⟩</text>
