<text class="ts" x="10" y="55">|0⟩</text><text class="ts" x="10" y="115">|0⟩</text><text class="ts" x="10" y="195">|u⟩ = |1⟩</text>
<rect class="b" x="78.0" y="30.0" width="44" height="40" rx="7"/><text class="t" x="100" y="56">H</text><rect class="b" x="78.0" y="90.0" width="44" height="40" rx="7"/><text class="t" x="100" y="116">H</text>
<line class="p" x1="160" y1="110" x2="160" y2="190" style="stroke-width:2"/><circle class="f" cx="160" cy="110" r="6"/><rect class="b" x="138.0" y="170.0" width="44" height="40" rx="7"/><text class="t" x="160" y="196">S</text>
<line class="p" x1="220" y1="50" x2="220" y2="190" style="stroke-width:2"/><circle class="f" cx="220" cy="50" r="6"/><rect class="b" x="198.0" y="170.0" width="44" height="40" rx="7"/><text class="t" x="220" y="196">Z</text>
