<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-label="Roteiro de um algoritmo quântico: preparar |0…0⟩, aplicar portas H e chamadas ao oráculo Uf, e medir."><style>.b{fill:#1f2937;stroke:#a78bfa;stroke-width:2.5}.l{stroke:#9ca3af;stroke-width:2;fill:none}.p{stroke:#a78bfa;stroke-width:3;fill:none}.t{fill:#f3f4f6;font:600 18px sans-serif;text-anchor:middle}.s{fill:#d1d5db;font:15px sans-serif;text-anchor:middle}.v{fill:#a78bfa;font:600 16px sans-serif;text-anchor:middle}.f{fill:#a78bfa}.g{fill:#34d399}.d{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.st{text-anchor:start}</style><defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9ca3af"/></marker></defs><rect class="b" x="10" y="35" width="160" height="80" rx="10"/><text class="t" x="90" y="70" >1. Preparar</text><text class="s" x="90" y="98" >|0…0⟩</text><rect class="b" x="240" y="35" width="190" height="80" rx="10"/><text class="t" x="335" y="66" >2. Circuito</text><text class="s" x="335" y="90" >portas H + chamadas</text><rect x="290" y="97" width="90" height="14" rx="4" fill="#4b5563"/><text class="s" x="335" y="109" style="font-size:13px">U<tspan dy="4" style="font-size:11px">f</tspan></text><rect class="b" x="500" y="35" width="130" height="80" rx="10"/><text class="t" x="565" y="60" >3. Medir</text><rect class="b" x="545" y="73" width="40" height="40" rx="6"/><path class="l" d="M553 101 A12 12 0 0 1 577 101"/><line class="p" x1="565" y1="101" x2="573" y2="85" style="stroke-width:2"/><line class="l" x1="170" y1="75" x2="236" y2="75" marker-end="url(#a1)"/><line class="l" x1="430" y1="75" x2="496" y2="75" marker-end="url(#a1)"/><text class="s" x="335" y="142" >o oráculo é uma caixa-preta no meio do circuito</text></svg>