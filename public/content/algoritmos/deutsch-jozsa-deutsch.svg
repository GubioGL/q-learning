<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" role="img" aria-label="Circuito de Deutsch: H nos dois qubits, oráculo Uf, H no qubit de cima e medida; depois dos H o estado é |+⟩|−⟩ e depois do oráculo o de cima é ±|+⟩ ou ±|−⟩."><style>.b{fill:#1f2937;stroke:#a78bfa;stroke-width:2.5}.l{stroke:#9ca3af;stroke-width:2;fill:none}.p{stroke:#a78bfa;stroke-width:3;fill:none}.t{fill:#f3f4f6;font:600 18px sans-serif;text-anchor:middle}.s{fill:#d1d5db;font:15px sans-serif;text-anchor:middle}.v{fill:#a78bfa;font:600 16px sans-serif;text-anchor:middle}.f{fill:#a78bfa}.g{fill:#34d399}.d{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.st{text-anchor:start}</style><line class="l" x1="70" y1="70" x2="380" y2="70"/><line class="l" x1="70" y1="150" x2="290" y2="150"/><text class="t" x="36" y="76" >|0⟩</text><text class="t" x="36" y="156" >|1⟩</text><rect class="b" x="90.0" y="50.0" width="40" height="40" rx="8"/><text class="t" x="110" y="76" >H</text><rect class="b" x="90.0" y="130.0" width="40" height="40" rx="8"/><text class="t" x="110" y="156" >H</text><rect class="b" x="190" y="35" width="70" height="150" rx="10"/><text class="t" x="225" y="116" >U<tspan dy="5" style="font-size:13px">f</tspan></text><rect class="b" x="310.0" y="50.0" width="40" height="40" rx="8"/><text class="t" x="330" y="76" >H</text><rect class="b" x="380" y="50" width="40" height="40" rx="6"/><path class="l" d="M388 78 A12 12 0 0 1 412 78"/><line class="p" x1="400" y1="78" x2="408" y2="62" style="stroke-width:2"/><text class="s" x="400" y="125" >medir</text><line class="d" x1="155" y1="25" x2="155" y2="185"/><line class="d" x1="300" y1="25" x2="300" y2="185"/><text class="t" x="155" y="212" >|+⟩|−⟩</text><text class="t" x="300" y="212" >±|+⟩ ou ±|−⟩ ; |−⟩</text><text class="v" x="515" y="60" >0 → constante</text><text class="v" x="515" y="86" >1 → balanceada</text></svg>