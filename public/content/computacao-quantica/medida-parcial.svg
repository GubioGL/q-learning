<svg xmlns="http://www.w3.org/2000/svg" width="710" height="130" viewBox="0 0 710 130" role="img" aria-label="Medir o primeiro qubit: filtrar os termos compatíveis e renormalizar">
  <style>.b{fill:#1f2937;stroke:#a78bfa;stroke-width:2.5}.l{stroke:#9ca3af;stroke-width:2;fill:none}.p{stroke:#a78bfa;stroke-width:3;fill:none}.t{fill:#f3f4f6;font:600 18px sans-serif;text-anchor:middle}.s{fill:#d1d5db;font:15px sans-serif;text-anchor:middle}.v{fill:#a78bfa;font:600 16px sans-serif;text-anchor:middle}.f{fill:#a78bfa}.g{fill:#34d399}.d{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:5 5;fill:none}</style>
  <rect class="b" x="10" y="30" width="205" height="60" rx="8"/>
  <text class="t" x="112" y="66">½|00⟩+½|01⟩+|11⟩/√2</text>
  <text class="s" x="112" y="115">estado</text>
  <line class="p" x1="218" y1="60" x2="246" y2="60"/><polyline class="p" points="235.2,54.8 246.0,60.0 235.2,65.2" style="stroke-dasharray:none"/>
  <rect class="b" x="250" y="30" width="205" height="60" rx="8"/>
  <text class="t" x="352" y="66">½|00⟩ + ½|01⟩</text>
  <text class="s" x="352" y="115">1º qubit = 0 (P = ½)</text>
  <line class="p" x1="458" y1="60" x2="486" y2="60"/><polyline class="p" points="475.2,54.8 486.0,60.0 475.2,65.2" style="stroke-dasharray:none"/>
  <rect class="b" x="490" y="30" width="205" height="60" rx="8"/>
  <text class="t" x="592" y="66">(|00⟩ + |01⟩)/√2</text>
  <text class="s" x="592" y="115">renormalizado</text>
</svg>
