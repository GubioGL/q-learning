<svg xmlns="http://www.w3.org/2000/svg" width="640" height="225" viewBox="0 0 640 225" role="img" aria-label="Somador ripple-carry de 3 bits: três blocos em fila, o vai-um de cada coluna entra na próxima, b_i vira s_i e o último vai-um c₃ é o bit mais alto">
  <style>.b{fill:#1f2937;stroke:#a78bfa;stroke-width:2.5}.l{stroke:#9ca3af;stroke-width:2;fill:none}.p{stroke:#a78bfa;stroke-width:3;fill:none}.t{fill:#f3f4f6;font:600 18px sans-serif;text-anchor:middle}.s{fill:#d1d5db;font:15px sans-serif;text-anchor:middle}.v{fill:#a78bfa;font:600 16px sans-serif;text-anchor:middle}.f{fill:#a78bfa}.g{fill:#34d399}.d{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:5 5;fill:none}</style>
<text class="t" x="38" y="116" style="font-size:16px">c₀=0</text><line class="l" x1="65" y1="110" x2="90" y2="110"/><rect class="b" x="90" y="70" width="110" height="80" rx="9"/><text class="t" x="145" y="105" >Σ</text><text class="s" x="145" y="130" >coluna 0</text><line class="l" x1="200" y1="110" x2="240" y2="110"/><line class="l" x1="145" y1="30" x2="145" y2="70"/><text class="t" x="145" y="22" >a₀</text><line class="l" x1="145" y1="150" x2="145" y2="185"/><text class="v" x="145" y="208" >b₀ → s₀</text><text class="v" x="220" y="100" >c₁</text><rect class="b" x="240" y="70" width="110" height="80" rx="9"/><text class="t" x="295" y="105" >Σ</text><text class="s" x="295" y="130" >coluna 1</text><line class="l" x1="350" y1="110" x2="390" y2="110"/><line class="l" x1="295" y1="30" x2="295" y2="70"/><text class="t" x="295" y="22" >a₁</text><line class="l" x1="295" y1="150" x2="295" y2="185"/><text class="v" x="295" y="208" >b₁ → s₁</text><text class="v" x="370" y="100" >c₂</text><rect class="b" x="390" y="70" width="110" height="80" rx="9"/><text class="t" x="445" y="105" >Σ</text><text class="s" x="445" y="130" >coluna 2</text><line class="l" x1="500" y1="110" x2="540" y2="110"/><line class="l" x1="445" y1="30" x2="445" y2="70"/><text class="t" x="445" y="22" >a₂</text><line class="l" x1="445" y1="150" x2="445" y2="185"/><text class="v" x="445" y="208" >b₂ → s₂</text><text class="v" x="588" y="116" >c₃</text><text class="s" x="588" y="138" >bit mais alto</text>
</svg>
