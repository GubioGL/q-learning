<svg xmlns="http://www.w3.org/2000/svg" width="640" height="305" viewBox="0 0 640 305" role="img" aria-label="Dois circuitos equivalentes: medir o qubit 1 e aplicar X ao qubit 2 se der 1, ou aplicar CNOT e medir no fim, ambos com as mesmas probabilidades">
  <style>.b{fill:#1f2937;stroke:#a78bfa;stroke-width:2.5}.l{stroke:#9ca3af;stroke-width:2;fill:none}.p{stroke:#a78bfa;stroke-width:3;fill:none}.t{fill:#f3f4f6;font:600 18px sans-serif;text-anchor:middle}.s{fill:#d1d5db;font:15px sans-serif;text-anchor:middle}.v{fill:#a78bfa;font:600 16px sans-serif;text-anchor:middle}.f{fill:#a78bfa}.g{fill:#34d399}.d{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:5 5;fill:none}</style>
<text class="v" x="150" y="28" >medir, depois X</text><text class="v" x="470" y="28" >CNOT, depois medir</text><line class="d" x1="320" y1="40" x2="320" y2="250"/><text class="t" x="30" y="96" >|+⟩</text><text class="t" x="30" y="196" >|0⟩</text><line class="l" x1="55" y1="90" x2="131" y2="90"/><rect class="b" x="131" y="74" width="38" height="32" rx="6"/><path class="l" d="M139 98 A11 11 0 0 1 161 98"/><line class="l" x1="150" y1="98" x2="157" y2="83"/><line class="l" x1="147.5" y1="106" x2="147.5" y2="177"/><line class="l" x1="152.5" y1="106" x2="152.5" y2="177"/><line class="l" x1="55" y1="190" x2="130" y2="190"/><rect class="b" x="130.0" y="172.0" width="40" height="36" rx="7"/><text class="t" x="150" y="196" >X</text><line class="l" x1="170" y1="190" x2="290" y2="190"/><rect class="b" x="221" y="174" width="38" height="32" rx="6"/><path class="l" d="M229 198 A11 11 0 0 1 251 198"/><line class="l" x1="240" y1="198" x2="247" y2="183"/><text class="s" x="150" y="150" style="text-anchor:start" transform="translate(12 0)">se 1</text><text class="t" x="350" y="96" >|+⟩</text><text class="t" x="350" y="196" >|0⟩</text><line class="l" x1="375" y1="90" x2="590" y2="90"/><line class="l" x1="375" y1="190" x2="590" y2="190"/><line class="p" x1="420" y1="90" x2="420" y2="190"/><circle class="f" cx="420" cy="90" r="6"/><circle class="b" cx="420" cy="190" r="12"/><line class="p" x1="408" y1="190" x2="432" y2="190"/><line class="p" x1="420" y1="178" x2="420" y2="202"/><rect class="b" x="501" y="74" width="38" height="32" rx="6"/><path class="l" d="M509 98 A11 11 0 0 1 531 98"/><line class="l" x1="520" y1="98" x2="527" y2="83"/><rect class="b" x="501" y="174" width="38" height="32" rx="6"/><path class="l" d="M509 198 A11 11 0 0 1 531 198"/><line class="l" x1="520" y1="198" x2="527" y2="183"/><text class="v" x="320" y="285" >mesmas probabilidades: 00 ou 11, 50% cada</text>
