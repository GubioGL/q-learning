<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330" role="img" aria-label="Dois histogramas das 8 divisões do triângulo, de 000 a 111. Em cima, o estado uniforme: todas as barras iguais a 1/8. Embaixo, depois de uma camada de QAOA com bons parâmetros: as seis divisões de corte 2 (verdes) ficam com probabilidade 1/6 cada, e 000 e 111, de corte 0 (cinza), ficam com probabilidade zero."><title>Dois histogramas das 8 divisões do triângulo, de 000 a 111. Em cima, o estado uniforme: todas as barras iguais a 1/8. Embaixo, depois de uma camada de QAOA com bons parâmetros: as seis divisões de corte 2 (verdes) ficam com probabilidade 1/6 cada, e 000 e 111, de corte 0 (cinza), ficam com probabilidade zero.</title><style>.p{stroke:#a78bfa;stroke-width:2.5;fill:none}.l{stroke:#9ca3af;stroke-width:2;fill:none}.bx{stroke:#a78bfa;stroke-width:2;fill:rgba(167,139,250,.14)}.t{fill:#a78bfa;font:600 13.5px sans-serif;text-anchor:middle}.k{fill:#9ca3af;font:600 12.3px sans-serif;text-anchor:middle}.s{fill:#a78bfa;font:italic 13.5px sans-serif;text-anchor:middle}.d{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.g{stroke:#34d399;stroke-width:3;fill:none}.gf{fill:#34d399}.f{fill:#a78bfa}.tg{fill:#34d399;font:600 12.3px sans-serif;text-anchor:middle}.n0{fill:#3b82f6}.n1{fill:#f97316}.e0{stroke:#3b82f6;stroke-width:2.5;fill:none}.e1{stroke:#f97316;stroke-width:2.5;fill:none}.tb{fill:#3b82f6;font:600 13.5px sans-serif;text-anchor:middle}.to{fill:#f97316;font:600 13.5px sans-serif;text-anchor:middle}.w{fill:#fff;font:700 13.5px sans-serif;text-anchor:middle}</style>
