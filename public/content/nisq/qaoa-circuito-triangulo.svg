<svg xmlns="http://www.w3.org/2000/svg" width="472" height="214" viewBox="0 0 472 214" role="img" aria-label="Circuito QAOA com p=1 para o triângulo de 3 vértices. Cada qubit começa em |0⟩ e recebe H. A camada de custo tem três blocos, um por aresta (0,1), (1,2) e (0,2); cada bloco é CNOT, Rz(−γ) no qubit alvo, CNOT. A camada mixer aplica Rx(2β) em cada qubit. No fim, os três qubits são medidos."><title>Circuito QAOA com p=1 para o triângulo de 3 vértices. Cada qubit começa em |0⟩ e recebe H. A camada de custo tem três blocos, um por aresta (0,1), (1,2) e (0,2); cada bloco é CNOT, Rz(−γ) no qubit alvo, CNOT. A camada mixer aplica Rx(2β) em cada qubit. No fim, os três qubits são medidos.</title><style>.p{stroke:#a78bfa;stroke-width:2.5;fill:none}.l{stroke:#9ca3af;stroke-width:2;fill:none}.bx{stroke:#a78bfa;stroke-width:2;fill:rgba(167,139,250,.14)}.t{fill:#a78bfa;font:600 17.7px sans-serif;text-anchor:middle}.k{fill:#9ca3af;font:600 16.1px sans-serif;text-anchor:middle}.s{fill:#a78bfa;font:italic 17.7px sans-serif;text-anchor:middle}.d{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.g{stroke:#34d399;stroke-width:3;fill:none}.gf{fill:#34d399}.f{fill:#a78bfa}.tg{fill:#34d399;font:600 16.1px sans-serif;text-anchor:middle}.n0{fill:#3b82f6}.n1{fill:#f97316}.e0{stroke:#3b82f6;stroke-width:2.5;fill:none}.e1{stroke:#f97316;stroke-width:2.5;fill:none}.tb{fill:#3b82f6;font:600 17.7px sans-serif;text-anchor:middle}.to{fill:#f97316;font:600 17.7px sans-serif;text-anchor:middle}.w{fill:#fff;font:700 17.7px sans-serif;text-anchor:middle}</style>
