<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200" role="img" aria-label="Dois grafos de MaxCut com a divisão z = 010. Cada vértice é colorido pelo seu bit: azul para 0 e laranja para 1, com o número do vértice ao lado. À esquerda, o caminho 0-1-2; à direita, o triângulo. As arestas cortadas, entre cores diferentes, são verdes e contínuas; a aresta (0,2) do triângulo não é cortada e é tracejada. Em ambos o valor do corte é C=2."><title>Dois grafos de MaxCut com a divisão z = 010. Cada vértice é colorido pelo seu bit: azul para 0 e laranja para 1, com o número do vértice ao lado. À esquerda, o caminho 0-1-2; à direita, o triângulo. As arestas cortadas, entre cores diferentes, são verdes e contínuas; a aresta (0,2) do triângulo não é cortada e é tracejada. Em ambos o valor do corte é C=2.</title><style>.p{stroke:#a78bfa;stroke-width:2.5;fill:none}.l{stroke:#9ca3af;stroke-width:2;fill:none}.bx{stroke:#a78bfa;stroke-width:2;fill:rgba(167,139,250,.14)}.t{fill:#a78bfa;font:600 13.5px sans-serif;text-anchor:middle}.k{fill:#9ca3af;font:600 12.3px sans-serif;text-anchor:middle}.s{fill:#a78bfa;font:italic 13.5px sans-serif;text-anchor:middle}.d{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.g{stroke:#34d399;stroke-width:3;fill:none}.gf{fill:#34d399}.f{fill:#a78bfa}.tg{fill:#34d399;font:600 12.3px sans-serif;text-anchor:middle}.n0{fill:#3b82f6}.n1{fill:#f97316}.e0{stroke:#3b82f6;stroke-width:2.5;fill:none}.e1{stroke:#f97316;stroke-width:2.5;fill:none}.tb{fill:#3b82f6;font:600 13.5px sans-serif;text-anchor:middle}.to{fill:#f97316;font:600 13.5px sans-serif;text-anchor:middle}.w{fill:#fff;font:700 13.5px sans-serif;text-anchor:middle}</style>
