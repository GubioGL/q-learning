<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330" role="img" aria-label="Em cima, circuito de 2 qubits: o bloco e^{-iAt/n} seguido do bloco e^{-iBt/n}, repetido n vezes (seta de repetição e rótulo ×n). Embaixo, gráfico log-log do erro ε contra o número de passos n, de 1 a 100: o erro cai em linha reta, proporcional a 1/n, de cerca de 0,8 para 0,007."><title>Em cima, circuito de 2 qubits: o bloco e^{-iAt/n} seguido do bloco e^{-iBt/n}, repetido n vezes (seta de repetição e rótulo ×n). Embaixo, gráfico log-log do erro ε contra o número de passos n, de 1 a 100: o erro cai em linha reta, proporcional a 1/n, de cerca de 0,8 para 0,007.</title><style>.p{stroke:#a78bfa;stroke-width:2.5;fill:none}.l{stroke:#9ca3af;stroke-width:2;fill:none}.bx{stroke:#a78bfa;stroke-width:2;fill:rgba(167,139,250,.14)}.t{fill:#a78bfa;font:600 13.5px sans-serif;text-anchor:middle}.k{fill:#9ca3af;font:600 12.3px sans-serif;text-anchor:middle}.s{fill:#a78bfa;font:italic 13.5px sans-serif;text-anchor:middle}.d{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.g{stroke:#34d399;stroke-width:3;fill:none}.gf{fill:#34d399}.f{fill:#a78bfa}.tg{fill:#34d399;font:600 12.3px sans-serif;text-anchor:middle}.n0{fill:#3b82f6}.n1{fill:#f97316}.e0{stroke:#3b82f6;stroke-width:2.5;fill:none}.e1{stroke:#f97316;stroke-width:2.5;fill:none}.tb{fill:#3b82f6;font:600 13.5px sans-serif;text-anchor:middle}.to{fill:#f97316;font:600 13.5px sans-serif;text-anchor:middle}.w{fill:#fff;font:700 13.5px sans-serif;text-anchor:middle}</style>
