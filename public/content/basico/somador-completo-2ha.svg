<svg xmlns="http://www.w3.org/2000/svg" width="452" height="215" viewBox="0 0 452 215" role="img" aria-label="Somador completo feito de dois meio-somadores (HA) e uma porta OR. O primeiro HA (roxo) soma A e B; o segundo HA (amarelo) soma esse resultado com Cin. Dentro de cada HA, XOR (símbolo de soma) dá o bit de soma e AND (símbolo &amp;) dá o vai-um. Os dois vai-um entram no OR, que produz Cout; a soma S sai do segundo HA."><title>Somador completo feito de dois meio-somadores (HA) e uma porta OR. O primeiro HA (roxo) soma A e B; o segundo HA (amarelo) soma esse resultado com Cin. Dentro de cada HA, XOR (símbolo de soma) dá o bit de soma e AND (símbolo &amp;) dá o vai-um. Os dois vai-um entram no OR, que produz Cout; a soma S sai do segundo HA.</title><style>.p{stroke:#a78bfa;stroke-width:2.5;fill:none}.l{stroke:#9ca3af;stroke-width:2;fill:none}.bx{stroke:#a78bfa;stroke-width:2;fill:rgba(167,139,250,.14)}.t{fill:#a78bfa;font:600 17.0px sans-serif;text-anchor:middle}.k{fill:#9ca3af;font:600 15.4px sans-serif;text-anchor:middle}.s{fill:#a78bfa;font:italic 17.0px sans-serif;text-anchor:middle}.d{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.g{stroke:#34d399;stroke-width:3;fill:none}.gf{fill:#34d399}.f{fill:#a78bfa}.tg{fill:#34d399;font:600 15.4px sans-serif;text-anchor:middle}.n0{fill:#3b82f6}.n1{fill:#f97316}.e0{stroke:#3b82f6;stroke-width:2.5;fill:none}.e1{stroke:#f97316;stroke-width:2.5;fill:none}.tb{fill:#3b82f6;font:600 17.0px sans-serif;text-anchor:middle}.to{fill:#f97316;font:600 17.0px sans-serif;text-anchor:middle}.w{fill:#fff;font:700 17.0px sans-serif;text-anchor:middle}</style>
